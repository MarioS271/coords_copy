name: release
on:
  push:
    tags:
      - '*.*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      mc_version: ${{ steps.validate.outputs.mc_version }}
      build_tasks: ${{ steps.validate.outputs.build_tasks }}
      publish_tasks: ${{ steps.validate.outputs.publish_tasks }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag is an active MC version
        id: validate
        run: |
          TAG="${GITHUB_REF_NAME}"
          LINE=$(grep -E "^\s+match\(\"${TAG}\"" settings.gradle.kts || true)
          if [ -z "$LINE" ]; then
            echo "::error::Tag '${TAG}' is not an active MC version in settings.gradle.kts"
            exit 1
          fi
          # Extract the loaders from e.g. match("1.21.8", "fabric", "neoforge")
          LOADERS=$(echo "$LINE" | sed -E 's/^\s*match\("[^"]+"\s*,\s*//; s/\).*$//' | tr -d ' "' | tr ',' '\n')
          BUILD_TASKS=""
          PUBLISH_TASKS=""
          for L in $LOADERS; do
            BUILD_TASKS="$BUILD_TASKS :${TAG}-${L}:buildAndCollect"
            PUBLISH_TASKS="$PUBLISH_TASKS :${TAG}-${L}:publishMods"
          done
          echo "mc_version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "build_tasks=${BUILD_TASKS# }" >> "$GITHUB_OUTPUT"
          echo "publish_tasks=${PUBLISH_TASKS# }" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build & Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MOD_IS_RELEASE: true
      MC_VERSION: ${{ needs.validate.outputs.mc_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: microsoft

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build MC ${{ needs.validate.outputs.mc_version }}
        run: ./gradlew ${{ needs.validate.outputs.build_tasks }} --no-daemon

      - name: Drop javadoc jars from release assets
        if: vars.PUB_GITHUB_RELEASES == 'true'
        run: find build/libs -name '*-javadoc.jar' -delete

      - name: Publish to GitHub Releases
        if: vars.PUB_GITHUB_RELEASES == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/**/*.jar
          generate_release_notes: true
          make_latest: true

      - name: Publish to Modrinth and CurseForge
        if: vars.PUB_MODS_ENABLE == 'true'
        env:
          PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
          PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
          PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
          PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
          PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
          PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
        run: ./gradlew ${{ needs.validate.outputs.publish_tasks }} --stacktrace
