name: build
on: [ pull_request ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: microsoft

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - run: ./gradlew buildAndCollect --no-daemon
